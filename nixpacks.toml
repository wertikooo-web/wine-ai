# Headless-browser crawling (src/kos/sources/headlessBrowser.js, opt-in
# policy.renderJs) uses @sparticuz/chromium's prebuilt Linux Chromium
# binary. Confirmed live in production logs: without these system shared
# libraries present, launching it fails with
# "libnspr4.so: cannot open shared object file" — Railway's default
# Nixpacks Node image doesn't include them.
#
# A first attempt via [phases.setup] nixPkgs did not fix this — Nix
# packages install under /nix/store/<hash>-<pkg>/lib, which is not on the
# dynamic linker's default search path unless Nixpacks explicitly wires
# LD_LIBRARY_PATH for the *runtime* image (it reliably does for the
# language-runtime provider's own packages, not confirmed for arbitrary
# extra nixPkgs). Using aptPkgs instead: apt-installed packages register
# directly in the system ld.so cache under standard paths
# (/usr/lib/x86_64-linux-gnu/), which any prebuilt binary — including one
# it never saw at build time — can find without special environment setup.
[phases.setup]
aptPkgs = [
  "libnspr4",
  "libnss3",
  "libdbus-1-3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2",
  "libpango-1.0-0",
  "libcairo2",
  "libgtk-3-0",
]
