name: Railway Production Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Railway deployment and verify health
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://wine-ai-realtime-production.up.railway.app"
          HEALTH_FILE="$(mktemp)"
          READY=0

          for attempt in $(seq 1 60); do
            code="$(curl -sS -L --max-time 20 -o "$HEALTH_FILE" -w '%{http_code}' "$BASE_URL/health" || true)"
            echo "health attempt=$attempt http=$code"
            if [ "$code" = "200" ]; then
              cat "$HEALTH_FILE"
              READY=1
              break
            fi
            sleep 10
          done

          if [ "$READY" != "1" ]; then
            echo "Railway production did not become healthy within 10 minutes"
            cat "$HEALTH_FILE" || true
            exit 1
          fi

      - name: Verify knowledge status
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://wine-ai-realtime-production.up.railway.app"
          STATUS_FILE="$(mktemp)"
          code="$(curl -sS -L --max-time 30 -o "$STATUS_FILE" -w '%{http_code}' "$BASE_URL/api/knowledge/status")"
          echo "knowledge status http=$code"
          cat "$STATUS_FILE"
          test "$code" = "200"
          node - "$STATUS_FILE" <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body.ok !== true) throw new Error('knowledge status ok != true');
          const chunks = Number(body.chunk_count ?? body.chunks ?? 0);
          if (!Number.isFinite(chunks) || chunks <= 0) throw new Error('knowledge chunk count is empty');
          console.log(`knowledge status verified; chunks=${chunks}`);
          NODE

      - name: Verify public dashboard
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://wine-ai-realtime-production.up.railway.app"
          code="$(curl -sS -L --max-time 30 -o /tmp/dashboard.html -w '%{http_code}' "$BASE_URL/dashboard")"
          echo "dashboard http=$code bytes=$(wc -c < /tmp/dashboard.html)"
          test "$code" = "200"
          test "$(wc -c < /tmp/dashboard.html)" -gt 1000

      # Cost & Usage Control (Dashboard → Расходы / Cost Control). Only after a
      # merge to main: a PR run hits production before the feature is deployed.
      # Retries while Railway rolls out the new build (health can already be
      # green on the previous deployment).
      - name: Verify Cost Control (post-deploy)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://wine-ai-realtime-production.up.railway.app"
          SUMMARY_FILE="$(mktemp)"
          OK=0
          for attempt in $(seq 1 40); do
            code="$(curl -sS -L --max-time 30 -o "$SUMMARY_FILE" -w '%{http_code}' "$BASE_URL/api/cost/summary" || true)"
            echo "cost summary attempt=$attempt http=$code"
            if [ "$code" = "200" ]; then OK=1; break; fi
            sleep 15
          done
          test "$OK" = "1"
          node - "$SUMMARY_FILE" <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync(process.argv[2], 'utf8');
          const body = JSON.parse(raw);
          if (body.ok !== true) throw new Error('cost summary ok != true');
          if (body.storage !== 'postgres') throw new Error(`cost storage is ${body.storage}, expected postgres`);
          for (const key of ['today', 'last_7_days', 'month']) {
            if (!body.periods || !body.periods[key]) throw new Error(`missing period ${key}`);
          }
          if (!body.budget || body.budget.enforcement !== 'observability_only') throw new Error('budget must be observability_only');
          if (!body.customer_summary || typeof body.customer_summary.conversations !== 'number') throw new Error('customer summary missing');
          if (/api[_-]?key|authorization|bearer/i.test(raw)) throw new Error('secret-shaped field in cost summary');
          const m = body.periods.month;
          console.log(`cost control verified: storage=${body.storage} month=${m.month} conversations=${m.conversations} api_mdl=${m.api_cost_mdl} fixed_mdl=${m.fixed_cost_mdl} total_mdl=${m.total_cost_mdl} basis=${m.basis} recent_sessions=${body.recent_sessions.length}`);
          NODE
          for path in /api/cost/sessions /api/cost/breakdown /api/cost/pricing /api/cost/fixed-costs /api/cost/settings /api/cost/customer-summary /cost-control.js /dashboard/cost-guide; do
            # Retry each path: the previous deployment can keep serving for a
            # few minutes after merge and lack routes added by this commit.
            for attempt in $(seq 1 40); do
              code="$(curl -sS -L --max-time 30 -o /dev/null -w '%{http_code}' "$BASE_URL$path" || true)"
              echo "$path attempt=$attempt http=$code"
              if [ "$code" = "200" ]; then break; fi
              sleep 15
            done
            test "$code" = "200"
          done
          # Download first: `curl | grep -q` fails under pipefail when grep
          # exits early on the match (curl exit 23, write failure).
          FOUND=0
          for attempt in $(seq 1 40); do
            curl -sS -L --max-time 30 -o /tmp/dashboard-cost.html "$BASE_URL/dashboard" || true
            if grep -q 'data-tab="cost"' /tmp/dashboard-cost.html && grep -q 'href="/dashboard/cost-guide"' /tmp/dashboard-cost.html; then FOUND=1; break; fi
            echo "dashboard cost tab/guide link not found yet (attempt=$attempt)"
            sleep 15
          done
          test "$FOUND" = "1"
          echo "dashboard contains the Cost Control tab"
