name: Agent fix Gemini session deadline

on:
  push:
    branches:
      - agent/fix-gemini-session-deadline-grace

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[agent-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-gemini-session-deadline-grace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Baseline dashboard harness
        run: node --test tests/dashboardBargeIn.test.js
        continue-on-error: true
      - name: Apply focused fixes
        run: |
          python .github/agent_fix_gemini_session_deadline.py
          python -c "from pathlib import Path; p=Path('tests/freeConversationDeadlineRegression.test.js'); t=p.read_text(); p.write_text(t[2:] if t.startswith('\\\\\n') else t)"
      - name: Focused regression tests
        run: node --test tests/freeConversationDeadlineRegression.test.js tests/geminiProviderInterrupt.test.js tests/conversationSettings.test.js
      - name: Dashboard harness after patch
        run: node --test tests/dashboardBargeIn.test.js
        continue-on-error: true
      - name: Full test suite diagnostic
        run: npm test
        continue-on-error: true
      - name: Commit tested fix
        run: |
          rm .github/workflows/agent-fix-gemini-session-deadline.yml
          rm .github/agent_fix_gemini_session_deadline.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Fix Gemini Free Conversation deadline and routing [agent-fix-applied]"
          git push origin HEAD:agent/fix-gemini-session-deadline-grace
