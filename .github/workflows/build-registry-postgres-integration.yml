name: Build Registry (PostgreSQL Integration)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  registry-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
          POSTGRES_DB: registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U registry -d registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://registry:registry@localhost:5432/registry
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check for untracked local imports
        run: node scripts/check-missing-local-imports.js

      - name: Registry unit tests (in-memory transactional double)
        run: node tests/buildRegistryFoundation.test.js

      - name: Builder unit tests (fake pool)
        run: node tests/buildRegistryBuilder.test.js

      - name: Source contract unit tests (manifest <> builder hash agreement)
        run: node tests/sourceContract.test.js

      - name: Registration integration tests (real PostgreSQL + pgvector)
        run: node tests/buildRegistry.postgres.integration.test.js

      - name: Versioned builder integration tests (real PostgreSQL + pgvector)
        run: node tests/buildRegistryBuilder.postgres.integration.test.js