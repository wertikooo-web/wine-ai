name: Security Foundation

on:
  pull_request:
    paths:
      - 'tests/security/**'
      - 'scripts/security-foundation-check.js'
      - 'package.json'
      - '.github/workflows/security-foundation.yml'
  push:
    branches:
      - main
    paths:
      - 'tests/security/**'
      - 'scripts/security-foundation-check.js'
      - 'package.json'
      - '.github/workflows/security-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-security-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate security cases
        run: npm run test:security
