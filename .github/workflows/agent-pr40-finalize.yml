name: Finalize PR40 on current main

on:
  push:
    branches:
      - agent/fix-gemini-session-deadline-grace

permissions:
  contents: write

jobs:
  merge-main-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[pr40-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-gemini-session-deadline-grace
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Merge current main, preserve PR40 intent on conflicting hunks
        run: |
          git fetch origin main
          git config user.name github-actions
          git config user.email github-actions@github.com
          git merge origin/main -X ours --no-edit
      - name: Apply final deadline edge hardening
        run: python .github/agent_pr40_finalize.py
      - name: Blocking regressions
        run: node --test tests/freeConversationDeadlineRegression.test.js tests/geminiProviderInterrupt.test.js
      - name: Related diagnostics
        run: node --test tests/dashboardBargeIn.test.js tests/conversationSettings.test.js
        continue-on-error: true
      - name: Full suite
        run: npm test
        continue-on-error: true
      - name: Commit source-only finalized branch
        run: |
          rm .github/workflows/agent-pr40-finalize.yml
          rm .github/agent_pr40_finalize.py
          git add -A
          git commit -m "Finalize Gemini deadline grace on current main [pr40-finalized]" || true
          git push origin HEAD:agent/fix-gemini-session-deadline-grace
