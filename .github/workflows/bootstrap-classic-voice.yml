name: Bootstrap classic voice integration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: contains(github.event.head_commit.message, 'bootstrap classic voice integration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/classic-stt-llm-tts
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: node scripts/finalize-classic-ui.js
      - run: npm test
      - run: npm run check:missing-imports

      - name: Commit integrated dashboard
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dashboard.html
          git commit -m "feat(voice): connect engine-family UI to dashboard"
          git push origin HEAD:feat/classic-stt-llm-tts
