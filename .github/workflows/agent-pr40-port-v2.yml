name: Port Gemini deadline fix v2

on:
  push:
    branches:
      - agent/fix-gemini-deadline-grace-v2

permissions:
  contents: write

jobs:
  port-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[gemini-deadline-v2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-gemini-deadline-grace-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Port reviewed PR40 source diff onto current main
        run: |
          git fetch origin agent/fix-gemini-session-deadline-grace
          BASE=$(git merge-base origin/main origin/agent/fix-gemini-session-deadline-grace)
          git diff "$BASE"..origin/agent/fix-gemini-session-deadline-grace -- \
            public/dashboard.html \
            src/persona/wineExpertPersona.js \
            src/realtime/realtimeServer.js \
            tests/freeConversationDeadlineRegression.test.js > /tmp/pr40.patch
          git apply --3way /tmp/pr40.patch
          git show origin/agent/fix-gemini-session-deadline-grace:.github/agent_pr40_followup.py > /tmp/pr40_followup.py
          python /tmp/pr40_followup.py
      - name: Blocking regression tests
        run: node --test tests/freeConversationDeadlineRegression.test.js tests/geminiProviderInterrupt.test.js
      - name: Related diagnostics
        run: node --test tests/dashboardBargeIn.test.js tests/conversationSettings.test.js
        continue-on-error: true
      - name: Full test suite
        run: npm test
        continue-on-error: true
      - name: Commit clean source-only fix
        run: |
          rm .github/workflows/agent-pr40-port-v2.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Fix Gemini deadline grace and Free Conversation hearing [gemini-deadline-v2-applied]"
          git push origin HEAD:agent/fix-gemini-deadline-grace-v2
