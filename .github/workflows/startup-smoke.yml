name: Startup Smoke on clean checkout

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  startup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check for untracked local imports
        run: node scripts/check-missing-local-imports.js

      - name: Layered knowledge and start-intent tests
        run: |
          node tests/layeredKnowledgeRouter.test.js
          node tests/layeredKnowledgeToolContract.test.js
          node tests/wineMdCatalogStore.test.js
          node tests/startIntentLauncher.test.js

      - name: Server startup (no env vars required)
        run: |
          PORT=8787
          node src/server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:$PORT/health" > /dev/null 2>&1; then
              echo "Server healthy after ${i}s"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server exited unexpectedly"
              exit 1
            fi
            sleep 1
          done
          curl -sf "http://localhost:$PORT/health" && echo " health OK"
          kill $SERVER_PID 2>/dev/null || true

      - name: Startup smoke tests
        env:
          REALTIME_PROVIDER: mock
        run: npm run test:smoke
