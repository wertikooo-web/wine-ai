<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WineMD Avatar Debug — mock runtime (no .riv, no production UI)</title>
<style>
  body { font-family: ui-monospace, monospace; background: #111; color: #eee; margin: 0; padding: 20px; }
  h1 { font-size: 14px; color: #f5c518; margin: 0 0 4px; }
  .note { color: #999; font-size: 12px; margin-bottom: 16px; }
  .row { display: flex; gap: 16px; }
  .panel { border: 1px solid #444; border-radius: 8px; padding: 12px; background: #1a1a1a; }
  #state { font-size: 20px; line-height: 1.6; white-space: pre; color: #7ee787; }
  #log { font-size: 11px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; color: #888; width: 480px; }
  input, button { font-family: inherit; font-size: 13px; padding: 6px 10px; }
  #status { font-weight: bold; }
</style>
</head>
<body>
<h1>WineMD Avatar Debug Harness</h1>
<p class="note">
  Не production UI. Не рендерит персонажа и не грузит .riv — показывает нормализованный AvatarCommand
  как текст, чтобы проверить контракт (схема + семантический адаптер + runtime) до появления реального .riv.
  Статус соединения: <span id="status">—</span>
</p>
<div class="row">
  <div class="panel">
    <div id="state">MODE: —</div>
    <div style="margin-top:16px;">
      <input id="textInput" placeholder="Вопрос сомелье…" size="40" value="Расскажи про Фетяска Нягрэ">
      <button id="sendBtn">Отправить</button>
      <button id="interruptBtn">Отправить как прерывание</button>
    </div>
  </div>
  <div class="panel">
    <div id="log"></div>
  </div>
</div>
<script type="module" src="./avatar-debug.mjs"></script>
</body>
</html>
